    # volumes:
    #   - ./radarlib_overrides.json:/workspace/app/radarlib_overrides.json:ro # Read-only volume for radarlib overrides
    command: [ "tail", "-f", "/dev/null" ]

  genpro25-rma1:
    # environment:
    #   RADARLIB_CONFIG: "/workspace/app/radarlib_overrides.json"
    # volumes:
    #   - ./radarlib_overrides.json:/workspace/app/radarlib_overrides.json:ro # Read-only volume for radarlib overrides
    command: [ "tail", "-f", "/dev/null" ]

  genpro25-ar8:
    command: [ "tail", "-f", "/dev/null" ]

  genpro25-rma2:
    # environment:
    #   RADARLIB_CONFIG: "/workspace/app/radarlib_overrides.json"
    # volumes:
